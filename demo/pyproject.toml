[project]
name = "mucodi-demo"
version = "0.1.0"
description = "Offline asset pipeline for the MuCoDi in-browser chest CT demo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "CC-BY-NC-4.0"
authors = [{ name = "Maurice Heide" }]
dependencies = [
    "dcm2niix>=1.0.20250506",
    "idc-index>=0.9",
    # Same major versions as the thesis lock: the student backbone is MONAI's EfficientNet,
    # whose block layout changed across minors, so MONAI stays on the 1.4 line.
    "monai>=1.4,<1.5",
    "nibabel==5.4.2",
    "numpy>=1.26,<2.0",  # MONAI 1.4.0 requires numpy<2
    "onnx>=1.19",
    "onnxruntime==1.30.*",  # same release as onnxruntime-web, so parity uses identical kernels
    "onnxscript>=0.5",
    "pandas>=2.3",
    "pyarrow>=17,<22",  # pyarrow 22+ needs numpy 2, MONAI 1.4 needs numpy 1
    "pydicom>=3.0",
    "torch==2.11.*",
    "typer>=0.15",
]

[project.scripts]
mucodi-demo = "mucodi_demo.cli:app"

[dependency-groups]
dev = ["mypy>=1.15", "pytest>=8.3", "ruff>=0.11"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mucodi_demo"]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
