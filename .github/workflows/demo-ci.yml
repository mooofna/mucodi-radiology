name: Demo CI

# The in-browser demo: the offline asset pipeline (demo/) and the site (web/). The training and
# evaluation code of the thesis needs GPUs and gated data and is not run here.

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "web/**"
      - "scripts/check_style.py"
      - "**/*.md"
      - ".github/workflows/demo-ci.yml"
  pull_request:
    paths:
      - "demo/**"
      - "web/**"
      - "scripts/check_style.py"
      - "**/*.md"
      - ".github/workflows/demo-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: House style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_style.py

  pipeline:
    name: Asset pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: demo/uv.lock
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Type check
        run: uv run mypy src tests
      - name: Tests (offline, seeded random weights)
        run: uv run pytest

  web:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download the core demo assets (t-line and B0 models, scans, evidence)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download demo-assets --pattern web-assets-core.tar.gz --dir "$RUNNER_TEMP"
          mkdir -p demo/.local/assets
          tar -xzf "$RUNNER_TEMP/web-assets-core.tar.gz" -C demo/.local/assets
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: |
          npm ci
          npm run assets
      - name: Check, lint and unit tests
        working-directory: web
        run: |
          npm run check
          npm run lint
          npm test
      - name: End-to-end and accessibility tests
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
