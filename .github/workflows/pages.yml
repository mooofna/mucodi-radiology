name: Deploy demo

# Builds the static site with every model, scan and evidence file from the demo-assets release and
# publishes it on GitHub Pages. After replacing release assets, run this workflow by hand.

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download the demo assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download demo-assets --pattern "web-assets-*" --dir "$RUNNER_TEMP/assets"
          mkdir -p demo/.local/assets
          for bundle in "$RUNNER_TEMP"/assets/web-assets-*; do
            tar -xf "$bundle" -C demo/.local/assets
          done
          du -sh demo/.local/assets
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build
        working-directory: web
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm ci
          npm run assets
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
